name: Build

# Debug APK: on every push to main, and on every manual run.
# Signed release bundle (.aab): on a manual run (tick the box), or when you push
# a tag that starts with "v", for example v0.1.0.
#
# The bundle needs these repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build the signed release bundle (.aab)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_AAB: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_aab) || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Real errors and warnings fail the build. Style hints do not.
      - run: flutter analyze --no-fatal-infos

      # ---------- debug APK (always) ----------
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: stillscreen-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # ---------- signed release bundle (when asked for) ----------
      - name: Restore upload key from secrets
        if: env.BUILD_AAB == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 STORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!name}" ]; then
              echo "The secret behind $name is missing or empty."
              exit 1
            fi
          done

          KS="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"

          # Pasted secrets often carry a stray space or line break. Remove them.
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          STORE_PASS="$(trim "$STORE_PASS")"
          KEY_PASS="$(trim "$KEY_PASS")"
          KEY_ALIAS="$(trim "$KEY_ALIAS")"

          LISTING="$(keytool -list -keystore "$KS" -storepass "$STORE_PASS" 2>&1 || true)"
          echo "--- keystore contents (alias names and fingerprints are not secret) ---"
          echo "$LISTING" | grep -E "Keystore type|PrivateKeyEntry|SHA-256|SHA256|password was incorrect|not a keystore|tampered" || true

          if echo "$LISTING" | grep -qE "password was incorrect|tampered"; then
            echo "The keystore password in ANDROID_KEYSTORE_PASSWORD is wrong for this keystore."
            exit 1
          fi

          # Use the configured alias if it exists. Otherwise, if the keystore holds
          # exactly one key, use that one.
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            mapfile -t FOUND < <(echo "$LISTING" | grep "PrivateKeyEntry" | cut -d, -f1)
            if [ "${#FOUND[@]}" -eq 1 ]; then
              echo "::warning::ANDROID_KEY_ALIAS does not match. Using the only key in the keystore instead."
              KEY_ALIAS="${FOUND[0]}"
            else
              echo "ANDROID_KEY_ALIAS matches no key, and the keystore holds ${#FOUND[@]} keys."
              echo "Check that ANDROID_KEYSTORE_BASE64 is the right file."
              exit 1
            fi
          fi

          # PKCS12 keystores (the default) use one password for the store and the key.
          if echo "$LISTING" | grep -q "Keystore type: PKCS12"; then
            KEY_PASS="$STORE_PASS"
          fi

          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" "$KS" > android/key.properties
          echo "Signing settings written."

      - name: Build release bundle
        if: env.BUILD_AAB == 'true'
        run: flutter build appbundle --release

      - name: Show who signed it, and refuse the debug key
        if: env.BUILD_AAB == 'true'
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256"
          if keytool -printcert -jarfile "$AAB" | grep -qi "Android Debug"; then
            echo "Signed with the debug key. Do not upload."
            exit 1
          fi

      - name: Check the release has no internet permission
        if: env.BUILD_AAB == 'true'
        run: |
          if find build -path '*release*' -name AndroidManifest.xml -print0 | xargs -0 grep -l "android.permission.INTERNET" ; then
            echo "INTERNET permission found in a release manifest."
            exit 1
          fi
          echo "No INTERNET permission in the release manifests."

      - name: Upload release bundle
        if: env.BUILD_AAB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stillscreen-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### Build result"
            echo "- App version: $(grep '^version:' pubspec.yaml | cut -d' ' -f2)"
            echo "- Debug APK: stillscreen-debug-apk"
            if [ "$BUILD_AAB" = "true" ]; then
              echo "- Release bundle: stillscreen-release-aab"
            else
              echo "- Release bundle: skipped (run manually with the box ticked, or push a v* tag)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"