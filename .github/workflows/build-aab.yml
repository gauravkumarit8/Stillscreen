name: Build signed release bundle

# Run it by hand: Actions tab > Build signed release bundle > Run workflow.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore upload key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ]; then
            echo "Add the secrets UPLOAD_KEYSTORE_BASE64 and UPLOAD_KEYSTORE_PASSWORD first."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=%s\n' \
            "$STORE_PASS" "$STORE_PASS" "$RUNNER_TEMP/upload.jks" > android/key.properties

      - run: flutter pub get

      - run: flutter build appbundle --release

      - name: Check it is signed with your key, not the debug key
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | head -5
          if keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -qi "Android Debug"; then
            echo "Signed with the debug key. Do not upload."
            exit 1
          fi

      - name: Check the release has no internet permission
        run: |
          if find build -path '*release*' -name AndroidManifest.xml -print0 | xargs -0 grep -l "android.permission.INTERNET" ; then
            echo "INTERNET permission found in a release manifest."
            exit 1
          fi
          echo "No INTERNET permission in the release manifests."

      - uses: actions/upload-artifact@v4
        with:
          name: stillscreen-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
